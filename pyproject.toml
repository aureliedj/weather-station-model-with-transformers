# Tooling only; the project is not packaged. Run the entry points from the
# repository root (python src/main.py ...) or via scripts/*.sh.

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["archive", "notebooks", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B008"]
